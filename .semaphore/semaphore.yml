version: v1.0
name: city-records
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204

fail_fast:
  stop:
    when: "branch != 'main'"
auto_cancel:
  running:
    when: "branch != 'main'"
  queued:
    when: "branch = 'main'"

global_job_config:
  prologue:
    commands:
      - checkout
      - curl -LsSf https://astral.sh/uv/install.sh | sh
      - export PATH="$HOME/.local/bin:$PATH"

blocks:
  - name: Pipeline
    dependencies: []
    task:
      jobs:
        - name: dg check defs + pytest
          commands:
            - cd pipeline
            - cache restore uv-pipeline-$(checksum uv.lock)
            - uv sync --frozen
            - cache store uv-pipeline-$(checksum uv.lock) .venv
            - uv run dg check defs
            - uv run pytest -q

  - name: API
    dependencies: []
    task:
      jobs:
        - name: pytest (unit)
          commands:
            - cd api
            - cache restore uv-api-$(checksum uv.lock)
            - uv sync --frozen
            - cache store uv-api-$(checksum uv.lock) .venv
            - uv run pytest -q -m "not integration"

  - name: Web
    dependencies: []
    task:
      jobs:
        - name: lint + build
          commands:
            - cd web
            - sem-version node 22
            - npm install -g pnpm
            - cache restore pnpm-$(checksum pnpm-lock.yaml)
            - pnpm install --frozen-lockfile
            - cache store pnpm-$(checksum pnpm-lock.yaml) node_modules
            - pnpm lint
            - pnpm build

# Deploy is a manual promotion so a green test run never rolls the cluster by itself.
# Requires the secrets city-records-gcp and city-records-app (see infra/README.md).
promotions:
  - name: Deploy to GKE
    pipeline_file: deploy.yml
