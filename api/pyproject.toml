[project]
name = "cityrecords-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2",
  "fastmcp>=2.10,<3",
  "honeybadger>=0.20",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cityrecords_api"]

[tool.pytest.ini_options]
markers = ["integration: runs against the real database"]
testpaths = ["tests"]
