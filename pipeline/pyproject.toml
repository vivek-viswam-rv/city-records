[project]
name = "cityrecords"
requires-python = ">=3.12,<3.13"
version = "0.1.0"
dependencies = [
    "alembic>=1.20.0",
    "beautifulsoup4>=4.15.0",
    "boto3>=1.43.111",
    "dagster==1.13.26",
    "dagster-postgres>=0.29.26",
    "honeybadger>=1.3.0",
    "langfuse>=4.17.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "rapidfuzz>=3.14.6",
    "requests>=2.34.2",
    "sqlalchemy>=2,<2.1",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "cityrecords"



[tool.pytest.ini_options]
testpaths = ["tests"]
